databases:
  - name: mail-tracker-db
    plan: free             # free Postgres is deleted ~30 days after creation; upgrade before real customers
    region: singapore

services:
  - type: web
    name: mail-tracker
    runtime: docker
    rootDir: backend
    plan: free             # sleeps after ~15 min idle; use starter for customers
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mail-tracker-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false        # e.g. https://mail-tracker.onrender.com
      - key: ADDON_AUDIENCE
        sync: false        # OAuth client ID of the add-on's Cloud project
